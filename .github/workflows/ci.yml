name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --dart-define=APP_VERSION=android-${GITHUB_SHA::7}
      - uses: actions/upload-artifact@v5
        with:
          name: cliniflow-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: Build iOS (sans signature)
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build ios --release --no-codesign --dart-define=APP_VERSION=ios-${GITHUB_SHA::7}
      # Contrôle de l'icône : catalogue source et icônes compilées dans l'app.
      - name: Diagnostic de l'icône iOS
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          {
            echo "== appiconset"; ls -la ios/Runner/Assets.xcassets/AppIcon.appiconset || true
            echo "== Contents.json"; cat ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json || true
            echo "== pbxproj"; grep -n "APPICON\|ASSETCATALOG" ios/Runner.xcodeproj/project.pbxproj || true
            APP=build/ios/iphoneos/Runner.app
            echo "== app"; ls "$APP" | grep -i -E "icon|car" || true
            echo "== Info.plist"; plutil -p "$APP/Info.plist" | grep -i -A12 icon || true
            echo "== Assets.car"; xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" | grep -E '"Name"|"RenditionName"|"Idiom"|"PixelWidth"' | head -80 || true
            echo "== xcode"; xcodebuild -version
          } > "$RUNNER_TEMP/diag/icon.txt" 2>&1
          cd "$RUNNER_TEMP/diag"
          git init -q -b ios-diag
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "diag ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ios-diag

  web:
    name: Build web
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap_web.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons-web.yaml
      - run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=APP_VERSION=web-${GITHUB_SHA::7}
          --no-web-resources-cdn
      # Chaque version remplace l'ancienne sans délai : pas de service worker
      # ni de cache navigateur sur le point d'entrée.
      - run: python3 tool/web_no_cache.py build/web "${GITHUB_SHA::7}"
      # Les routes de l'app sont internes : on sert index.html pour toute URL.
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      # Copie de la version web dans une branche, pour les captures d'écran
      # de contrôle prises hors de GitHub.
      - name: Publier l'aperçu dans la branche web-preview
        if: github.event_name == 'push'
        run: |
          cd build/web
          git init -q -b web-preview
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com \
            commit -qm "web ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web-preview

  deploy-web:
    name: Publier sur GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
