name: TestFlight

# Compile l'app iOS, la signe avec la clé API App Store Connect (signature
# gérée par Apple) et l'envoie sur App Store Connect / TestFlight.
#
# Secrets requis (Settings › Secrets and variables › Actions) :
#   APPLE_TEAM_ID   identifiant d'équipe Apple Developer (10 caractères)
#   ASC_KEY_ID      Key ID de la clé API App Store Connect
#   ASC_ISSUER_ID   Issuer ID affiché au-dessus de la liste des clés
#   ASC_KEY_P8      contenu complet du fichier AuthKey_XXXX.p8
#
# Lancement : onglet Actions › TestFlight › Run workflow, ou en poussant un tag
# de la forme v1.2.3.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build et envoi TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Vérifier les secrets
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$KEY_P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installer la clé API App Store Connect
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      # Numéro de build unique et croissant : le numéro d'exécution du workflow,
      # décalé pour rester au-dessus des builds envoyés à la main.
      - name: Préparer le projet Xcode
        run: |
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          set -o pipefail
          flutter build ios --release --config-only --no-codesign \
            --build-number "$BUILD_NUMBER" \
            --dart-define=APP_VERSION=ios-${GITHUB_SHA::7} \
            2>&1 | tee "$RUNNER_TEMP/prepare.log"

      - name: Archiver (signature automatique)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error|warning: .*sign|BUILD|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"

      - name: Exporter et envoyer sur App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          echo "### Build $BUILD_NUMBER envoyé sur App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Il apparaît dans TestFlight après le traitement par Apple (10 à 30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Supprimer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      # En cas d'échec, les journaux (sans secret) sont déposés dans la branche
      # ci-logs pour pouvoir être lus hors de GitHub.
      - name: Publier les journaux d'échec
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          for f in prepare archive export; do
            [ -f "$RUNNER_TEMP/$f.log" ] && tail -n 400 "$RUNNER_TEMP/$f.log" > "$RUNNER_TEMP/logs/$f.log"
          done
          echo "run ${GITHUB_RUN_ID} ${GITHUB_SHA::7}" > "$RUNNER_TEMP/logs/README"
          cd "$RUNNER_TEMP/logs"
          git init -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "logs ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
